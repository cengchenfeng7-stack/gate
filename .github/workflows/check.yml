name: VPN Gate Node Check

on:
  schedule:
    - cron: "0 */2 * * *"   # 每 2 小时自动抓取并更新一次
  workflow_dispatch:        # 支持在 GitHub 网页上手动点击运行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          # 核心修正：完美对接你当前的真实检测 Worker (edgetunnel-kv)
          CHECK_WORKER: "https://edgetunnel-kv.cengchenfeng7.workers.dev/check?sstp=vpn:vpn@"
          WORKER_CHECK_URL: "https://edgetunnel-kv.cengchenfeng7.workers.dev/check?sstp=vpn:vpn@"
          PUBLIC_DIR: "./web"
          # 每个国家精选保留的最快节点数 (默认 5 个，想要 8 个改这里即可)
          MAX_PER_COUNTRY: "5"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "✅ Site deployed successfully"
          echo "URL: https://${{ github.repository_owner }}.github.io/gate/"
