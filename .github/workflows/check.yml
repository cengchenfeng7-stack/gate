name: VPN Gate Node Check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # 如果你需要用 hosts 覆盖自定义域，请把 Fix DNS 放在任何 curl/请求之前
      - name: Fix DNS resolution
        run: |
          echo "104.16.132.229 check-sstp.chengchenfeng7.workers.dev" | sudo tee -a /etc/hosts
          # 如果 runner 需要将自定义域映射到特定 IP，也加入下面一行：
          # echo "104.16.132.229 check.mufengzhijia.ccwu.cc" | sudo tee -a /etc/hosts || true

      - name: Test Worker connection
        run: |
          echo "测试自定义域名连通性..."
          curl -I -m 10 "https://check.mufengzhijia.ccwu.cc/" || true

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          WORKER_CHECK_URL: "https://check.mufengzhijia.ccwu.cc/"
          # 把脚本产物写到 ./web（与后续 Upload Pages artifact 保持一致）
          PUBLIC_DIR: "./web"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /web)"
            curl -sS -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/web"}}' \
              "https://api.github.com/repos/${{ github.repository }}/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://${{ github.repository_owner }}.github.io/gate/ ..."'
